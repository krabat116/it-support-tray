# ============================================================
# .github/workflows/build.yml
#
# 두 가지 트리거:
#   1. main 브랜치 push → .exe 빌드 후 Artifact로 저장 (테스트용)
#   2. v*.*.* 태그 push → GitHub Release 생성 및 배포 (프로덕션)
#
# 릴리즈 방법:
#   git tag v1.0.1 && git push origin v1.0.1
# ============================================================

name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. Supabase 인증 파일 생성 (GitHub Secrets에서 주입)
      - name: Create Supabase credentials file
        shell: bash
        run: |
          echo '{
            "url": "${{ secrets.SUPABASE_URL }}",
            "anonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }' > config/supabase.json

      # 5a. 빌드 소스 컴파일 (공통)
      - name: Build source
        run: npm run build

      # 5b. main 브랜치 push: 패키징만 (Artifact로 저장)
      - name: Package (branch build)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder

      # 5c. 태그 push: 패키징 + GitHub Release 자동 생성
      - name: Package and publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Artifact 업로드 (브랜치 빌드만 — 릴리즈 빌드는 GitHub Release에 자동 업로드됨)
      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: IT-Support-Tool-Windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 30
